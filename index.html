<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO EVE - Vòng Quay May Mắn</title>
    <!-- Nhúng thư viện Firebase tương thích phục vụ lưu trữ đám mây -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; position: relative; }
        h1 { color: #ffcc00; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .wheel-wrapper { position: relative; width: 320px; height: 320px; margin: 0 auto; }
        canvas { border-radius: 50%; border: 5px solid #ffcc00; transition: transform 4s ease-out; width: 100%; height: 100%; }
        .spin-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; background: #ffcc00; color: #0f172a; border: none; border-radius: 50%; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #ffcc00; z-index: 10; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PHOTO EVE</h1>
        <p>Vòng quay: 1 tuần/giải Nhất, 2 ngày/giải Nhì, 1 ngày/giải Ba</p>
        
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <canvas id="wheel" width="300" height="300"></canvas>
            <button class="spin-btn" id="spinBtn">QUAY</button>
        </div>
    </div>

    <script>
        // 1. CẤU HÌNH KẾT NỐI DATABASE FIREBASE CỦA BẠN
        const firebaseConfig = { 
            databaseURL: "https://photoeve-xxxx-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. VẼ ĐỒ HỌA VÒNG QUAY BẰNG CANVAS
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const gifts = ["Giải Ba: Móc Khóa", "Giải Nhì: Set Sticker", "Giải Nhất: Túi Tote", "Giải Ba: Móc Khóa", "Giải Nhì: Set Sticker", "May Mắn Lần Sau"];
        const colors = ["#10b981", "#3b82f6", "#ef4444", "#10b981", "#3b82f6", "#475569"];
        const numSectors = gifts.length;
        const arc = 2 * Math.PI / numSectors;

        function drawWheel() {
            for (let i = 0; i < numSectors; i++) {
                let angle = i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(150, 150, 150, angle, angle + arc);
                ctx.lineTo(150, 150);
                ctx.fill();
                
                // Vẽ chữ text giải thưởng lên các ô ô màu
                ctx.save();
                ctx.translate(150, 150);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "white";
                ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "right";
                ctx.fillText(gifts[i], 140, 5);
                ctx.restore();
            }
        }
        drawWheel();

        // 3. XỬ LÝ SỰ KIỆN KHI KHÁCH ẤN NÚT QUAY
        let isSpinning = false;
        const spinBtn = document.getElementById('spinBtn');
        
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            
            // Tính toán góc xoay ngẫu nhiên tạo hiệu ứng
            const randomDegree = Math.floor(Math.random() * 360) + 1800;
            canvas.style.transform = `rotate(${randomDegree}deg)`;
            
            // Lấy chuỗi ngày hiện tại dạng YYYY-MM-DD dựa theo múi giờ hệ thống
            const now = new Date();
            const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            
            // Gửi dữ liệu đồng bộ cộng 1 lượt quay thời gian thực lên Firebase
            database.ref('total_spins/' + todayStr).transaction((currentValue) => {
                return (currentValue || 0) + 1;
            });

            // Mở khóa lại nút bấm sau khi vòng quay dừng lại (sau 4 giây)
            setTimeout(() => {
                isSpinning = false;
            }, 4000);
        });
    </script>
</body>
</html>
