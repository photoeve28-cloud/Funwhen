<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CHỐNG LƯU CACHE TẠI TRÌNH DUYỆT -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>PHOTO EVE - Vòng Quay Trúng Thưởng Neo-Classical</title>
    
    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            font-family: 'Cinzel', 'Playfair Display', 'Segoe UI', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #2b2d42 0%, #11131e 100%);
            color: #f8fafc;
        }

        /* 1. THƯƠNG HIỆU PHONG CÁCH TÂN CỔ ĐIỂN (NEO-CLASSICAL GOLD) */
        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 4px;
            /* Gradient màu Vàng Đồng Sang Trọng */
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-transform: uppercase;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.8));
        }
        .brand-subtitle {
            font-size: 15px;
            letter-spacing: 3px;
            color: #d4af37;
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* 2. KHỐI VÒNG QUAY VỚI VIỀN VÀNG SANG TRỌNG */
        .wheel-container {
            position: relative;
            margin: 10px 0 20px 0;
            padding: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #bf953f, #aa771c);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }
        #wheel {
            border-radius: 50%;
            display: block;
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 34px solid #d4af37;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.7));
        }

        /* 3. NÚT QUAY TÂN CỔ ĐIỂN */
        button {
            padding: 14px 46px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #11131e;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #b38728 100%);
            border: 2px solid #ffe599;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
        }
        button:active {
            transform: translateY(1px);
        }

        /* 4. KẾT QUẢ VÀ BẢNG THÔNG TIN */
        #resultText {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #fcf6ba;
            display: none;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .info-panel {
            margin-top: 20px;
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(5px);
            text-align: center;
        }
        .spin-count {
            font-size: 18px;
            font-weight: 700;
            color: #fcf6ba;
            margin-bottom: 6px;
        }
        .time-display {
            font-size: 20px;
            font-weight: 700;
            color: #e2e8f0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- THƯƠNG HIỆU -->
    <div class="brand-header">
        <h1 class="brand-title">PHOTO EVE</h1>
        <div class="brand-subtitle">Vòng Quay May Mắn</div>
    </div>

    <!-- KHỐI VÒNG QUAY -->
    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
    </div>

    <!-- NÚT ĐIỀU KHIỂN & KẾT QUẢ -->
    <button id="spinBtn">QUAY</button>
    <div id="subText" style="margin-top: 10px; color: #94a3b8; font-size: 14px;">Bấm nút để thử vận may ngay!</div>
    <div id="resultText"></div>
    
    <!-- THÔNG TIN LƯỢT QUAY VÀ THỜI GIAN -->
    <div class="info-panel">
        <div class="spin-count" id="spinCountDisplay">Đang tải lượt quay...</div>
        <div class="time-display" id="clockDisplay">00:00:00 - 00/00/0000</div>
    </div>

    <script>
        // 1. CẤU HÌNH FIREBASE
        const firebaseConfig = { 
            databaseURL: "https://photoeve-xxxx-default-rtdb.firebaseio.com/" 
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // 2. LẤY KHÓA NGÀY UTC+7 (YYYY-MM-DD)
        function getVietnamDateKey() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const todayKey = getVietnamDateKey();
        const storageKey = 'PHOTOEVE_SPINS_' + todayKey;

        // 3. XỬ LÝ BỘ ĐẾM CỘNG DỒN NỐI TIẾP (BỀN VỮNG KHI TẮT/BẬT TRANG)
        function getSavedSpins() {
            const saved = localStorage.getItem(storageKey);
            return saved ? parseInt(saved, 10) : 0;
        }

        function saveSpins(count) {
            localStorage.setItem(storageKey, count);
        }

        let currentTotalSpins = getSavedSpins();

        function updateSpinDisplay() {
            // Hiển thị lượt quay tiếp theo trong ngày
            document.getElementById('spinCountDisplay').innerText = `Lượt quay trong ngày: #${currentTotalSpins + 1}`;
        }
        updateSpinDisplay();

        // Thử đồng bộ với Firebase nếu có kết nối
        const spinRef = database.ref('daily_spins/' + todayKey);
        spinRef.on('value', (snapshot) => {
            if (snapshot.exists()) {
                currentTotalSpins = snapshot.val();
                saveSpins(currentTotalSpins);
                updateSpinDisplay();
            }
        }, (err) => console.log("Đang dùng bộ nhớ máy cục bộ."));

        // 4. CẬP NHẬT ĐỒNG HỒ MÚI GIỜ HÀ NỘI
        function updateClock() {
            const now = new Date();
            const options = {
                timeZone: 'Asia/Ho_Chi_Minh',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour12: false
            };
            const formatter = new Intl.DateTimeFormat('vi-VN', options);
            const parts = formatter.formatToParts(now);
            let t = {};
            parts.forEach(p => t[p.type] = p.value);
            document.getElementById('clockDisplay').innerText = `${t.hour}:${t.minute}:${t.second} - ${t.day}/${t.month}/${t.year}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 5. VẼ VÒNG QUAY MÀU SẮC NEO-CLASSICAL (ĐẬM SANG TRỌNG)
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const gifts = ["Giải Ba: Móc Khóa", "Giải Nhì: Set Sticker", "Giải Nhất: Túi Tote", "Giải Ba: Móc Khóa", "Giải Nhì: Set Sticker", "May Mắn Lần Sau"];
        
        // Bảng màu Tân cổ điển đầm và đậm: Burgundy, Navy, Emerald, Ochre, Slate, Charcoal
        const colors = ["#800020", "#1B2A4A", "#2C5E3B", "#C5A059", "#34495E", "#2C3E50"];
        const numSectors = gifts.length;
        const arc = 2 * Math.PI / numSectors;

        function drawWheel() {
            for (let i = 0; i < numSectors; i++) {
                let angle = i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(160, 160, 160, angle, angle + arc);
                ctx.lineTo(160, 160);
                ctx.fill();
                
                // Viền vàng nhỏ giữa các ô
                ctx.strokeStyle = "rgba(212, 175, 55, 0.4)";
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.save();
                ctx.translate(160, 160);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "#FCF6BA"; // Chữ màu vàng nhạt sang trọng
                ctx.font = "bold 13px serif";
                ctx.textAlign = "right";
                ctx.fillText(gifts[i], 150, 5);
                ctx.restore();
            }
        }
        drawWheel();

        // 6. XỬ LÝ QUAY TÍT (GIẢM 3S Ở GIAI ĐOẠN 1: TỔNG TỪ 24S BỎ CÒN 21S)
        let isSpinning = false;
        let animationId = null;
        let currentAngle = 0;
        
        const spinBtn = document.getElementById('spinBtn');
        const subText = document.getElementById('subText');
        const resultText = document.getElementById('resultText');
        
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            
            subText.style.display = 'none';
            resultText.style.display = 'none';
            
            if (animationId) cancelAnimationFrame(animationId);
            
            // CỘNG DỒN LƯỢT QUAY NGAY KHI BẤM
            currentTotalSpins += 1;
            saveSpins(currentTotalSpins);
            updateSpinDisplay();

            // Ghi dữ liệu lên Firebase
            spinRef.transaction((val) => (val || 0) + 1);

            const randomShift = Math.floor(Math.random() * 360); 
            const totalDuration = 21000; // Đã giảm 3s (Tổng cộng 21 giây)
            let startTime = null;

            function animateWheel(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed < totalDuration) {
                    let currentSpeed = 0;

                    // GIAI ĐOẠN 1: Quay tít giảm từ 10s xuống còn 7s (7000ms)
                    if (elapsed <= 7000) {
                        currentSpeed = 35; 
                    } 
                    // GIAI ĐOẠN 2: Giảm tốc trong 10s tiếp theo (7s -> 17s)
                    else if (elapsed <= 17000) {
                        let t = (elapsed - 7000) / 10000;
                        currentSpeed = 35 * (1 - t); 
                    } 
                    // GIAI ĐOẠN 3: Lắc lư kịch tính 4s cuối (17s -> 21s)
                    else {
                        let t = (elapsed - 17000) / 4000;
                        let targetAngle = Math.ceil(currentAngle / 360) * 360 + randomShift;
                        let shake = Math.sin(t * Math.PI * 4) * (1 - t) * 25; 
                        currentAngle = targetAngle + shake;
                    }

                    if (elapsed <= 17000) {
                        currentAngle += currentSpeed;
                    }

                    canvas.style.transform = `rotate(${currentAngle % 360}deg)`;
                    animationId = requestAnimationFrame(animateWheel);
                } else {
                    // KẾT THÚC VÀ HIỂN THỊ KẾT QUẢ
                    const finalAngle = (Math.ceil(currentAngle / 360) * 360 + randomShift) % 360;
                    canvas.style.transform = `rotate(${finalAngle}deg)`;
                    currentAngle = finalAngle;
                    
                    const index = Math.floor(((360 - finalAngle + 270) % 360) / (360 / numSectors));
                    const prize = gifts[index];

                    resultText.innerHTML = prize === "May Mắn Lần Sau" ? `🎉 Chúc bạn ${prize}!` : `🎁 Trúng giải: ${prize}!`;
                    resultText.style.display = 'block';
                    
                    isSpinning = false;
                }
            }

            animationId = requestAnimationFrame(animateWheel);
        });
    </script>
</body>
</html>
