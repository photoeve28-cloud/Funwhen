<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CHỐNG TRÌNH DUYỆT LƯU CACHE CŨ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>PHOTO EVE - Vòng Quay May Mắn</title>
    
    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            font-family: 'Cinzel', 'Playfair Display', 'Segoe UI', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            /* TÔNG NỀN MỚI: SANG TRỌNG BẮT MẮT VỚI HIỆU ỨNG ÁNH KIM VÀ LỚP PHỦ SÂU */
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 60%, #020617 100%);
            color: #f8fafc;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 15px;
        }
        .brand-title {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-transform: uppercase;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.8));
        }
        .brand-subtitle {
            font-size: 16px;
            letter-spacing: 3px;
            color: #f3e8ff;
            margin-top: 6px;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* VIỀN MỚI CỰC KỲ NỔI BẬT CHO VÒNG QUAY */
        .wheel-container {
            position: relative;
            margin: 10px 0 15px 0;
            padding: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #b8860b, #d4af37);
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.5), inset 0 0 15px rgba(0,0,0,0.5);
        }
        #wheel {
            border-radius: 50%;
            display: block;
        }
        
        /* KIM CHỈ VÒNG QUAY ĐƯỢC CĂN CHỈNH TỌA ĐỘ CHÍNH XÁC */
        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 32px solid #ff3333; /* Đổi màu đỏ nổi bật dễ quan sát */
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.9));
        }

        button {
            padding: 12px 42px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #0f172a;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #b38728 100%);
            border: 2px solid #ffe599;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            transition: all 0.2s ease;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.7);
        }

        #resultText {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            display: none;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .info-panel {
            margin-top: 15px;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            text-align: center;
        }
        .spin-count {
            font-size: 16px;
            font-weight: 700;
            color: #fcf6ba;
        }
        .time-display {
            font-size: 18px;
            font-weight: 700;
            color: #cbd5e1;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1 class="brand-title">PHOTO EVE</h1>
        <div class="brand-subtitle">Vòng Quay May Mắn</div>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="340" height="340"></canvas>
    </div>

    <button id="spinBtn">QUAY</button>
    <div id="subText" style="margin-top: 8px; color: #94a3b8; font-size: 13px;">Bấm nút để thử vận may ngay!</div>
    <div id="resultText"></div>
    
    <div class="info-panel">
        <div class="spin-count" id="spinCountDisplay">Lượt quay trong ngày: #...</div>
        <div class="time-display" id="clockDisplay">00:00:00 - 00/00/0000</div>
    </div>

    <script>
        // 1. QUẢN LÝ THỜI GIAN & BỘ ĐẾM
        function getTodayKey() {
            const now = new Date();
            return `PHOTOEVE_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        }

        function getWeekKey() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const yearStart = new Date(d.getFullYear(), 0, 1);
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return `PHOTOEVE_WEEK_${d.getFullYear()}-W${weekNo}`;
        }

        function getCompletedSpinsCount() {
            const saved = localStorage.getItem(`${getTodayKey()}_TOTAL`);
            return saved ? parseInt(saved, 10) : 0;
        }

        function renderSpinCounter() {
            const nextSpinNumber = getCompletedSpinsCount() + 1;
            document.getElementById('spinCountDisplay').innerText = `Lượt quay trong ngày: #${nextSpinNumber}`;
        }
        renderSpinCounter();

        // 2. FIREBASE CONFIG
        const firebaseConfig = { databaseURL: "https://photoeve-cloud-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const spinRef = database.ref('daily_spins/' + getTodayKey());

        // 3. ÂM THANH
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playTickSound() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playWinSound() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                let startTime = audioCtx.currentTime + index * 0.1;
                gain.gain.setValueAtTime(0.2, startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.3);
            });
        }

        // 4. ĐỒNG HỒ
        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', second: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric', hour12: false };
            const formatter = new Intl.DateTimeFormat('vi-VN', options);
            const parts = formatter.formatToParts(now);
            let t = {};
            parts.forEach(p => t[p.type] = p.value);
            document.getElementById('clockDisplay').innerText = `${t.hour}:${t.minute}:${t.second} - ${t.day}/${t.month}/${t.year}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 5. CẤU HÌNH BÀN QUAY 8 Ô THEO YÊU CẦU CỦA BẠN
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        
        // Cơ cấu 8 ô: 1 VIP, 2 Thú bông, 2 Móc khóa, 3 Chúc may mắn
        const gifts = [
            "VIP PHOTO EVE - Album",        // Ô 0
            "May Mắn - Thú bông mini",     // Ô 1
            "Quà Kỷ Niệm - Móc khóa xinh", // Ô 2
            "Chúc Bạn May Mắn Lần Sau",   // Ô 3
            "May Mắn - Thú bông mini",     // Ô 4
            "Quà Kỷ Niệm - Móc khóa xinh", // Ô 5
            "Chúc Bạn May Mắn Lần Sau",   // Ô 6
            "Chúc Bạn May Mắn Lần Sau"    // Ô 7
        ];
        
        const colors = ["#800020", "#1B2A4A", "#2C5E3B", "#34495E", "#1B2A4A", "#2C5E3B", "#34495E", "#2C3E50"];
        const numSectors = gifts.length;
        const sectorAngleDeg = 360 / numSectors; // 45 độ mỗi ô
        const arc = 2 * Math.PI / numSectors;

        function drawWheel() {
            ctx.clearRect(0, 0, 340, 340);
            for (let i = 0; i < numSectors; i++) {
                let angle = i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(170, 170, 170, angle, angle + arc);
                ctx.lineTo(170, 170);
                ctx.fill();
                
                ctx.strokeStyle = "rgba(255, 215, 0, 0.5)";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.save();
                ctx.translate(170, 170);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "#FCF6BA"; 
                ctx.font = "bold 10px sans-serif";
                ctx.textAlign = "right";
                ctx.fillText(gifts[i], 160, 4);
                ctx.restore();
            }
        }
        drawWheel();

        // 6. THUẬT TOÁN KIỂM TRA ĐIỀU KIỆN TRÚNG THƯỞNG
        function determinePrizeIndex() {
            const now = new Date();
            const dayOfWeek = now.getDay(); 
            const hour = now.getHours();
            const minute = now.getMinutes();
            const timeInMinutes = hour * 60 + minute;

            const weekKey = getWeekKey();
            const todayKey = getTodayKey();

            const vipWonWeek = parseInt(localStorage.getItem(`${weekKey}_VIP`) || '0', 10);
            const mayManWonWeek = parseInt(localStorage.getItem(`${weekKey}_MAYMAN`) || '0', 10);
            
            let sessionKey = "TONG";
            if (hour >= 6 && hour < 12) sessionKey = "SANG";
            else if (hour >= 12 && hour < 18) sessionKey = "CHIEU";
            else if (hour >= 18) sessionKey = "TOI";

            const mocKhoaWonSession = parseInt(localStorage.getItem(`${todayKey}_MOCKHOA_${sessionKey}`) || '0', 10);

            // A. GIẢI VIP PHOTO EVE - Album (Ô 0)
            if ((dayOfWeek === 5 || dayOfWeek === 0) && (timeInMinutes >= 1230 && timeInMinutes <= 1290)) {
                if (vipWonWeek < 2) {
                    localStorage.setItem(`${weekKey}_VIP`, vipWonWeek + 1);
                    return 0; 
                }
            }

            // B. GIẢI May Mắn - Thú bông mini (Ô 1 hoặc Ô 4)
            if ((dayOfWeek === 2 || dayOfWeek === 4 || dayOfWeek === 6) && (timeInMinutes >= 1200 && timeInMinutes <= 1320)) {
                if (mayManWonWeek < 3) {
                    localStorage.setItem(`${weekKey}_MAYMAN`, mayManWonWeek + 1);
                    return Math.random() > 0.5 ? 1 : 4; 
                }
            }

            // C. GIẢI Quà Kỷ Niệm - Móc khóa xinh (Ô 2 hoặc Ô 5)
            let maxMocKhoaAllowed = 0;
            const isWeekend = (dayOfWeek === 5 || dayOfWeek === 6 || dayOfWeek === 0);

            if (sessionKey === "SANG") maxMocKhoaAllowed = isWeekend ? 2 : 1;
            else if (sessionKey === "CHIEU") maxMocKhoaAllowed = isWeekend ? 4 : 2;
            else if (sessionKey === "TOI") maxMocKhoaAllowed = isWeekend ? 8 : 4;

            if (sessionKey !== "TONG" && mocKhoaWonSession < maxMocKhoaAllowed) {
                localStorage.setItem(`${todayKey}_MOCKHOA_${sessionKey}`, mocKhoaWonSession + 1);
                return Math.random() > 0.5 ? 2 : 5; 
            }

            // D. MẶC ĐỊNH TRÚNG "Chúc Bạn May Mắn Lần Sau" (Ô 3, 6, 7)
            const failSectors = [3, 6, 7];
            return failSectors[Math.floor(Math.random() * failSectors.length)];
        }

        // 7. XỬ LÝ QUAY TỰ NHIÊN & CHÍNH XÁC KÍCH THƯỚC/KIM CHỈ
        let isSpinning = false;
        let animationId = null;
        let currentRotation = 0; // Lưu vị trí góc hiện tại
        let lastSectorIndex = -1;
        
        const spinBtn = document.getElementById('spinBtn');
        const subText = document.getElementById('subText');
        const resultText = document.getElementById('resultText');
        
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            
            subText.style.display = 'none';
            resultText.style.display = 'none';
            
            if (animationId) cancelAnimationFrame(animationId);
            
            let newCompleted = getCompletedSpinsCount() + 1;
            localStorage.setItem(`${getTodayKey()}_TOTAL`, newCompleted);
            renderSpinCounter();
            spinRef.transaction((val) => (val || 0) + 1);

            // 1. Xác định ô giải thưởng trúng
            const winningIndex = determinePrizeIndex();

            // 2. Tính toán góc quay chuẩn xác cho Kim ở vị trí 12h (270 độ / -90 độ trong hệ tọa độ Canvas)
            // Tâm của ô i tính theo độ = i * 45 + 22.5
            const sectorCenterDeg = winningIndex * sectorAngleDeg + (sectorAngleDeg / 2);
            
            // Góc xoay cần đạt tới để tâm ô i dừng ở đỉnh 12h:
            const targetDegree = (360 - sectorCenterDeg + 270) % 360;
            
            // Số vòng quay cộng thêm (5 vòng) để tạo hiệu ứng nhanh mượt
            const extraRounds = 360 * 5; 
            
            // Tính tổng số độ xoay cần thêm từ vị trí hiện tại
            const startRotation = currentRotation;
            const targetRotation = startRotation + extraRounds + ((targetDegree - (startRotation % 360) + 360) % 360);

            const duration = 5000; // Thời gian quay cố định 5 giây mượt mà
            let startTime = null;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Công thức Ease-Out Cubic: Giúp tốc độ quay mượt và chậm dần đều
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentRotation = startRotation + (targetRotation - startRotation) * easeOut;

                // Xoay thẻ Canvas
                canvas.style.transform = `rotate(${currentRotation}deg)`;

                // Âm thanh mỗi khi đi qua ô mới
                const activeSector = Math.floor(((360 - (currentRotation % 360) + 270) % 360) / sectorAngleDeg) % numSectors;
                if (activeSector !== lastSectorIndex) {
                    playTickSound();
                    lastSectorIndex = activeSector;
                }

                if (progress < 1) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    const prize = gifts[winningIndex];
                    playWinSound();

                    if (prize === "Chúc Bạn May Mắn Lần Sau") {
                        resultText.innerHTML = `🎉 ${prize}! Chúc bạn may mắn lần kế tiếp.`;
                    } else {
                        resultText.innerHTML = `🎁 Chúc mừng bạn đã trúng: <br><span style="color:#fcf6ba; font-size:22px;">${prize}</span>!`;
                    }
                    resultText.style.display = 'block';
                    isSpinning = false;
                }
            }

            animationId = requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
