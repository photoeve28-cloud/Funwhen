<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CHỐNG TRÌNH DUYỆT LƯU CACHE CŨ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>PHOTO EVE - Vòng Quay May Mắn</title>
    
    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            font-family: 'Cinzel', 'Playfair Display', 'Segoe UI', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #2b2d42 0%, #11131e 100%);
            color: #f8fafc;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-title {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-transform: uppercase;
            filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.9));
        }
        .brand-subtitle {
            font-size: 18px;
            letter-spacing: 4px;
            color: #d4af37;
            margin-top: 8px;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.95;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .wheel-container {
            position: relative;
            margin: 10px 0 20px 0;
            padding: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #bf953f, #aa771c);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }
        #wheel {
            border-radius: 50%;
            display: block;
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 34px solid #d4af37;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.7));
        }

        button {
            padding: 14px 46px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #11131e;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #b38728 100%);
            border: 2px solid #ffe599;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
        }
        button:active {
            transform: translateY(1px);
        }

        #resultText {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #ff4d4d;
            display: none;
            text-align: center;
            text-shadow: 0 2px 8px rgba(255, 0, 0, 0.5), 0 2px 4px rgba(0,0,0,0.9);
        }

        .info-panel {
            margin-top: 20px;
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(5px);
            text-align: center;
        }
        .spin-count {
            font-size: 18px;
            font-weight: 700;
            color: #fcf6ba;
            margin-bottom: 6px;
        }
        .time-display {
            font-size: 20px;
            font-weight: 700;
            color: #e2e8f0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1 class="brand-title">PHOTO EVE</h1>
        <div class="brand-subtitle">Vòng Quay May Mắn</div>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="340" height="340"></canvas>
    </div>

    <button id="spinBtn">QUAY</button>
    <div id="subText" style="margin-top: 10px; color: #94a3b8; font-size: 14px;">Bấm nút để thử vận may ngay!</div>
    <div id="resultText"></div>
    
    <div class="info-panel">
        <div class="spin-count" id="spinCountDisplay">Lượt quay trong ngày: #...</div>
        <div class="time-display" id="clockDisplay">00:00:00 - 00/00/0000</div>
    </div>

    <script>
        // --- 1. HÀM TẠO KHÓA THỜI GIAN THEO NGÀY VÀ TUẦN ---
        function getTodayKey() {
            const now = new Date();
            return `PHOTOEVE_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        }

        function getWeekKey() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const yearStart = new Date(d.getFullYear(), 0, 1);
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return `PHOTOEVE_WEEK_${d.getFullYear()}-W${weekNo}`;
        }

        function getCompletedSpinsCount() {
            const saved = localStorage.getItem(`${getTodayKey()}_TOTAL`);
            return saved ? parseInt(saved, 10) : 0;
        }

        function renderSpinCounter() {
            const nextSpinNumber = getCompletedSpinsCount() + 1;
            document.getElementById('spinCountDisplay').innerText = `Lượt quay trong ngày: #${nextSpinNumber}`;
        }
        renderSpinCounter();

        // --- 2. CẤU HÌNH FIREBASE ---
        const firebaseConfig = { databaseURL: "https://photoeve-cloud-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const spinRef = database.ref('daily_spins/' + getTodayKey());

        // --- 3. ÂM THANH (WEB AUDIO API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playTickSound() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWinSound() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                let startTime = audioCtx.currentTime + index * 0.12;
                gain.gain.setValueAtTime(0.3, startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.4);
            });
        }

        // --- 4. ĐỒNG HỒ THỜI GIAN THỰC ---
        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', second: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric', hour12: false };
            const formatter = new Intl.DateTimeFormat('vi-VN', options);
            const parts = formatter.formatToParts(now);
            let t = {};
            parts.forEach(p => t[p.type] = p.value);
            document.getElementById('clockDisplay').innerText = `${t.hour}:${t.minute}:${t.second} - ${t.day}/${t.month}/${t.year}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 5. CẤU HÌNH VÒNG QUAY & MẢNG GIẢI THƯỞNG ---
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        
        // Vòng quay chia làm 8 ô cân đối
        const gifts = [
            "VIP PHOTO EVE - Album",        // Ô 0
            "May Mắn - Thú bông mini",     // Ô 1
            "Quà Kỷ Niệm - Móc khóa xinh", // Ô 2
            "Chúc Bạn May Mắn Lần Sau",   // Ô 3
            "Chúc Bạn May Mắn Lần Sau",   // Ô 4
            "Chúc Bạn May Mắn Lần Sau",   // Ô 5
            "Chúc Bạn May Mắn Lần Sau",   // Ô 6
            "Chúc Bạn May Mắn Lần Sau"    // Ô 7
        ];
        
        const colors = ["#800020", "#1B2A4A", "#2C5E3B", "#34495E", "#2C3E50", "#4A235A", "#1A5276", "#1E8449"];
        const numSectors = gifts.length;
        const arc = 2 * Math.PI / numSectors;

        function drawWheel() {
            for (let i = 0; i < numSectors; i++) {
                let angle = i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(170, 170, 170, angle, angle + arc);
                ctx.lineTo(170, 170);
                ctx.fill();
                
                ctx.strokeStyle = "rgba(212, 175, 55, 0.4)";
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.save();
                ctx.translate(170, 170);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "#FCF6BA"; 
                ctx.font = "bold 10px serif";
                ctx.textAlign = "right";
                ctx.fillText(gifts[i], 160, 4);
                ctx.restore();
            }
        }
        drawWheel();

        // --- 6. THUẬT TOÁN XÁC ĐỊNH GIẢI TRÚNG THEO THỜI GIAN & HẠN MỨC ---
        function determinePrizeIndex() {
            const now = new Date();
            const dayOfWeek = now.getDay(); // 0: Chủ nhật, 1: T2, 2: T3, 3: T4, 4: T5, 5: T6, 6: T7
            const hour = now.getHours();
            const minute = now.getMinutes();
            const timeInMinutes = hour * 60 + minute; // Đổi thời gian ra số phút trong ngày

            const weekKey = getWeekKey();
            const todayKey = getTodayKey();

            // Đọc số lượt đã trúng từ localStorage
            const vipWonWeek = parseInt(localStorage.getItem(`${weekKey}_VIP`) || '0', 10);
            const mayManWonWeek = parseInt(localStorage.getItem(`${weekKey}_MAYMAN`) || '0', 10);
            
            // Xử lý các khung giờ trong ngày: Sáng (06:00 - 11:59), Chiều (12:00 - 17:59), Tối (18:00 - 23:59)
            let sessionKey = "TONG";
            if (hour >= 6 && hour < 12) sessionKey = "SANG";
            else if (hour >= 12 && hour < 18) sessionKey = "CHIEU";
            else if (hour >= 18) sessionKey = "TOI";

            const mocKhoaWonSession = parseInt(localStorage.getItem(`${todayKey}_MOCKHOA_${sessionKey}`) || '0', 10);

            // A. KIỂM TRA GIẢI NHẤT: VIP PHOTO EVE - Album (Ô 0)
            // Khung 20h30 (1230p) đến 21h30 (1290p) T6 (5) và CN (0) | Tối đa 2 giải / tuần
            if ((dayOfWeek === 5 || dayOfWeek === 0) && (timeInMinutes >= 1230 && timeInMinutes <= 1290)) {
                if (vipWonWeek < 2) {
                    localStorage.setItem(`${weekKey}_VIP`, vipWonWeek + 1);
                    return 0; // Trúng VIP Album
                }
            }

            // B. KIỂM TRA GIẢI NHÌ: May Mắn - Thú bông mini (Ô 1)
            // Khung 20h00 (1200p) đến 22h00 (1320p) T3 (2), T5 (4), T7 (6) | Tối đa 3 giải / tuần
            if ((dayOfWeek === 2 || dayOfWeek === 4 || dayOfWeek === 6) && (timeInMinutes >= 1200 && timeInMinutes <= 1320)) {
                if (mayManWonWeek < 3) {
                    localStorage.setItem(`${weekKey}_MAYMAN`, mayManWonWeek + 1);
                    return 1; // Trúng Thú bông mini
                }
            }

            // C. KIỂM TRA GIẢI BA: Quà Kỷ Niệm - Móc khóa xinh (Ô 2)
            // Thứ 2 - Thứ 5: Sáng 1, Chiều 2, Tối 4
            // Thứ 6 - Chủ Nhật: Sáng 2, Chiều 4, Tối 8
            let maxMocKhoaAllowed = 0;
            const isWeekend = (dayOfWeek === 5 || dayOfWeek === 6 || dayOfWeek === 0);

            if (sessionKey === "SANG") maxMocKhoaAllowed = isWeekend ? 2 : 1;
            else if (sessionKey === "CHIEU") maxMocKhoaAllowed = isWeekend ? 4 : 2;
            else if (sessionKey === "TOI") maxMocKhoaAllowed = isWeekend ? 8 : 4;

            if (sessionKey !== "TONG" && mocKhoaWonSession < maxMocKhoaAllowed) {
                localStorage.setItem(`${todayKey}_MOCKHOA_${sessionKey}`, mocKhoaWonSession + 1);
                return 2; // Trúng Móc khóa xinh
            }

            // D. MẶC ĐỊNH: Trả về một trong các ô "Chúc Bạn May Mắn Lần Sau" (Ô 3 đến Ô 7)
            const failSectors = [3, 4, 5, 6, 7];
            return failSectors[Math.floor(Math.random() * failSectors.length)];
        }

        // --- 7. XỬ LÝ SỰ KIỆN QUAY HOẠT HỌA MƯỢT MÀ ---
        let isSpinning = false;
        let animationId = null;
        let currentAngle = 0;
        let lastSectorIndex = -1;
        
        const spinBtn = document.getElementById('spinBtn');
        const subText = document.getElementById('subText');
        const resultText = document.getElementById('resultText');
        
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            
            subText.style.display = 'none';
            resultText.style.display = 'none';
            
            if (animationId) cancelAnimationFrame(animationId);
            
            // Cập nhật số lượt quay trong ngày
            let newCompleted = getCompletedSpinsCount() + 1;
            localStorage.setItem(`${getTodayKey()}_TOTAL`, newCompleted);
            renderSpinCounter();
            spinRef.transaction((val) => (val || 0) + 1);

            // 1. Xác định ô giải thưởng sẽ trúng dựa theo thời gian thực
            const winningSectorIndex = determinePrizeIndex();

            // 2. Tính toán góc quay chính xác để kim chỉ đúng ô trúng thưởng
            const sectorAngle = 360 / numSectors; 
            const targetSectorCenter = 360 - (winningSectorIndex * sectorAngle + sectorAngle / 2);
            const extraRounds = 360 * 10; // Quay 10 vòng cho hấp dẫn
            const targetTotalAngle = extraRounds + targetSectorCenter;

            const totalDuration = 12000; // Thời gian quay 12 giây
            let startTime = null;
            let startAngle = currentAngle % 360;

            function animateWheel(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / totalDuration, 1);

                // Hiệu ứng Ease-Out giúp vòng quay chậm dần mượt mà
                const easeOutProgress = 1 - Math.pow(1 - progress, 4);
                currentAngle = startAngle + (targetTotalAngle - startAngle) * easeOutProgress;

                // Phát âm thanh khi đi qua từng ô
                const currentSector = Math.floor(((360 - (currentAngle % 360) + 270) % 360) / sectorAngle);
                if (currentSector !== lastSectorIndex) {
                    playTickSound();
                    lastSectorIndex = currentSector;
                }

                canvas.style.transform = `rotate(${currentAngle}deg)`;

                if (progress < 1) {
                    animationId = requestAnimationFrame(animateWheel);
                } else {
                    const prize = gifts[winningSectorIndex];
                    playWinSound();

                    if (prize === "Chúc Bạn May Mắn Lần Sau") {
                        resultText.innerHTML = `🎉 ${prize}! Cảm ơn bạn đã tham gia.`;
                    } else {
                        resultText.innerHTML = `🎁 Chúc mừng bạn đã trúng: <br><span style="color:#fcf6ba; font-size:24px;">${prize}</span>!`;
                    }
                    resultText.style.display = 'block';
                    isSpinning = false;
                }
            }

            animationId = requestAnimationFrame(animateWheel);
        });
    </script>
</body>
</html>
