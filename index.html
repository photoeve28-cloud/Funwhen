<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO EVE - Vòng Quay May Mắn</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #fcf6ba;
            margin-bottom: 20px;
            text-align: center;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(252, 246, 186, 0.4);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ef4444;
            z-index: 10;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }
        button {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        #spinBtn {
            background: linear-gradient(135deg, #fcf6ba 0%, #bf953f 100%);
            color: #000;
        }
        #recordBtn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #fff;
            border: 1px solid #fca5a5;
        }
        #installPwaBtn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: 1px solid #34d399;
            display: none;
        }
        #resultText {
            margin-top: 15px;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
            color: #fcf6ba;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <h1>PHOTO EVE</h1>

    <!-- KHU VỰC VÒNG QUAY -->
    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <!-- KHU VỰC NÚT BẤM ĐIỀU KHIỂN -->
    <div class="controls">
        <button id="spinBtn">QUAY MAY MẮN</button>
        <button id="recordBtn">🎥 QUAY VÀ TẢI VIDEO QUẢNG CÁO</button>
        <button id="installPwaBtn">📲 CÀI ĐẶT APP PHOTO EVE</button>
    </div>

    <!-- KHU VỰC HIỂN THỊ KẾT QUẢ -->
    <div id="resultText"></div>

    <!-- KỊCH BẢN XỬ LÝ CHÍNH (JAVASCRIPT) -->
    <script>
        // 1. KHỞI TẠO VÒNG QUAY
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultText = document.getElementById('resultText');

        const gifts = ["Thủ bông mini", "Móc khóa", "Màn Lần Sau", "Voucher 20k", "Ảnh in free", "Màn Lần Sau"];
        const colors = ["#1e293b", "#334155", "#0f172a", "#475569", "#1e293b", "#334155"];
        const numSectors = gifts.length;
        const sectorAngle = (2 * Math.PI) / numSectors;

        let currentRotation = 0;
        let isSpinning = false;

        // Vẽ các ô phần thưởng lên Canvas
        function drawWheel() {
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSectors; i++) {
                const angle = i * sectorAngle;
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + sectorAngle);
                ctx.fill();

                // Vẽ chữ phần thưởng
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + sectorAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fcf6ba";
                ctx.font = "bold 13px Arial";
                ctx.fillText(gifts[i], radius - 15, 5);
                ctx.restore();
            }
        }
        drawWheel();

        // 2. THUẬT TOÁN QUAY VÒNG QUAY
        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            resultText.innerText = "";

            const winningIndex = Math.floor(Math.random() * numSectors);
            const extraRounds = 5; // Số vòng quay tối thiểu
            const targetAngle = (360 * extraRounds) + (360 - (winningIndex * (360 / numSectors))) - (360 / numSectors / 2);
            
            let startTime = null;
            const duration = 12000; // Thời gian quay 12 giây

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Hiệu ứng quay chậm dần (easeOut)
                const easeOut = 1 - Math.pow(1 - progress, 4);
                currentRotation = targetAngle * easeOut;

                canvas.style.transform = `rotate(${currentRotation}deg)`;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    resultText.innerText = gifts[winningIndex] === "Màn Lần Sau" 
                        ? "🎉 Chúc bạn may mắn lần kế tiếp!" 
                        : `🎁 Chúc mừng bạn trúng: ${gifts[winningIndex]}!`;
                }
            }
            requestAnimationFrame(animate);
        }

        spinBtn.addEventListener('click', spin);

        // 3. MÃ QUAY VÀ TẢI VIDEO QUẢNG CÁO
        let mediaRecorder;
        let recordedChunks = [];
        const recordBtn = document.getElementById('recordBtn');

        recordBtn.addEventListener('click', () => {
            if (isSpinning) return;

            // Bắt luồng hình ảnh từ Canvas (30 FPS)
            const canvasStream = canvas.captureStream(30);
            recordedChunks = [];

            mediaRecorder = new MediaRecorder(canvasStream, {
                mimeType: 'video/webm;codecs=vp9'
            });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'PHOTO_EVE_VongQuay_QuangCao.webm';
                a.click();
                URL.revokeObjectURL(url);
                alert('Đã tải xong video quảng cáo vòng quay!');
            };

            mediaRecorder.start();
            spin(); // Tự động kích hoạt lượt quay

            // Tự động dừng quay sau 13 giây
            setTimeout(() => {
                if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            }, 13000);
        });

        // 4. MÃ TỰ ĐỘNG CÀI ĐẶT APP (PWA)
        let deferredPrompt = null;
        const installBtn = document.getElementById('installPwaBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.style.display = 'none';
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });
    </script>
</body>
</html>
