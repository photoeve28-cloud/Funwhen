<script>
        // 1. CẤU HÌNH KẾT NỐI DATABASE FIREBASE
        const firebaseConfig = { 
            databaseURL: "https://photoeve-xxxx-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. VẼ ĐỒ HỌA VÒNG QUAY BẰNG CANVAS
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const gifts = ["Giải Ba: Móc Khóa", "Giải Nhì: Set Sticker", "Giải Nhất: Túi Tote", "Giải Ba: Móc Khóa", "Giải Nhì: Set Sticker", "May Mắn Lần Sau"];
        const colors = ["#10b981", "#3b82f6", "#ef4444", "#10b981", "#3b82f6", "#475569"];
        const numSectors = gifts.length;
        const arc = 2 * Math.PI / numSectors;

        function drawWheel() {
            for (let i = 0; i < numSectors; i++) {
                let angle = i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(150, 150, 150, angle, angle + arc);
                ctx.lineTo(150, 150);
                ctx.fill();
                
                ctx.save();
                ctx.translate(150, 150);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "white";
                ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "right";
                ctx.fillText(gifts[i], 140, 5);
                ctx.restore();
            }
        }
        drawWheel();

        // 3. XỬ LÝ QUAY TÍT ĐỀU TẤT CẢ CÁC LƯỢT (ĐÃ SỬA LỖI TỐC ĐỘ)
        let isSpinning = false;
        let animationId = null;
        let currentAngle = 0; // Lưu góc xoay liên tục
        
        const spinBtn = document.getElementById('spinBtn');
        const subText = document.getElementById('subText');
        const resultText = document.getElementById('resultText');
        
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            
            // Ẩn văn bản cũ
            subText.style.display = 'none';
            resultText.style.display = 'none';
            
            // Dừng hoàn toàn luồng hoạt ảnh cũ trước khi khởi chạy lượt mới
            if (animationId) cancelAnimationFrame(animationId);
            
            const randomShift = Math.floor(Math.random() * 360); 
            const totalDuration = 15000; // Tổng thời gian chạy 15 giây
            let startTime = null; // Khởi tạo lại bộ đếm thời gian trống cho lượt này

            function animateWheel(timestamp) {
                // SỬA LỖI CỐT LÕI: Buộc startTime phải lấy mốc thời gian thực của lượt click này
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed < totalDuration) {
                    let currentSpeed = 0;

                    // GIAI ĐOẠN 1: 10 giây đầu (0s - 10s) -> Ép đạt vận tốc tối đa ngay lập tức
                    if (elapsed <= 4000) {
                        currentSpeed = 30; // 30 độ mỗi khung hình, đảm bảo cực tít giống lượt đầu
                    }
                    // GIAI ĐOẠN 2: 10 giây tiếp theo (10s - 20s) -> Hạ tốc độ mượt mà
                    else if (elapsed <= 8000) {
                        let t = (elapsed - 4000) / 4000;
                        currentSpeed = 30 * (1 - t * 0.7); 
                    }
                    // GIAI ĐOẠN 3: 5 giây tiếp theo (20s - 25s) -> Chạy lừ đừ tạo hồi hộp
                    else if (elapsed <= 12000) {
                        let t = (elapsed - 8000) / 4000;
                        currentSpeed = 9 * (1 - t); 
                    }
                    // GIAI ĐOẠN 4: 3 giây cuối (25s - 28s) -> Rung kim lắc ngược tại đích
                    else {
                        let t = (elapsed - 12000) / 3000;
                        let targetAngle = Math.ceil(currentAngle / 360) * 360 + randomShift;
                        let shake = Math.sin(t * Math.PI * 4) * (1 - t) * 15;
                        currentAngle = targetAngle + shake;
                    }

                    // Chỉ cộng dồn góc quay khi đang ở 3 giai đoạn đầu
                    if (elapsed <= 12000) {
                        currentAngle += currentSpeed;
                    }

                    // Cập nhật góc xoay vật lý cho Canvas
                    canvas.style.transform = `rotate(${currentAngle % 360}deg)`;
                    animationId = requestAnimationFrame(animateWheel);
                } else {
                    // KHI DỪNG HẲN: Thiết lập góc đích chuẩn xác để kết toán giải thưởng
                    const finalAngle = (Math.ceil(currentAngle / 360) * 360 + randomShift) % 360;
                    canvas.style.transform = `rotate(${finalAngle}deg)`;
                    currentAngle = finalAngle; // Đồng bộ lại biến góc nền
                    
                    const index = Math.floor(((360 - finalAngle + 270) % 360) / (360 / numSectors));
                    const prize = gifts[index];

                    // Hiện bảng chữ lớn cho khách chụp hình lưu niệm
                    resultText.innerHTML = prize === "May Mắn Lần Sau" ? `🎉 Chúc bạn ${prize}!` : `🎁 Trúng giải: ${prize}!`;
                    resultText.style.display = 'block';
                    
                    isSpinning = false; // Mở khóa nút bấm cho khách tiếp theo
                }
            }

            // Ghi nhận tăng lượt quay đồng bộ lên cơ sở dữ liệu Firebase
            const now = new Date();
            const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            database.ref('total_spins/' + todayStr).transaction((currentValue) => {
                return (currentValue || 0) + 1;
            });

            // Kích hoạt tiến trình vẽ
            animationId = requestAnimationFrame(animateWheel);
        });
    </script>
