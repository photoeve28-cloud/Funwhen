<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- KHỐI MÃ CHỐNG CACHE: Ép trình duyệt luôn tải bản mới nhất -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Vòng Quay Trúng Thưởng - PHOTO EVE</title>
    
    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8fafc;
        }
        .wheel-container {
            position: relative;
            margin-bottom: 20px;
        }
        #wheel {
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ef4444;
            z-index: 10;
        }
        button {
            padding: 12px 36px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }
        button:active {
            transform: scale(0.98);
        }
        #resultText {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #059669;
            display: none;
        }
        #dateDisplay {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <button id="spinBtn">QUAY</button>
    <div id="subText" style="margin-top: 10px; color: #64748b;">Bấm nút để quay thử vận may!</div>
    <div id="resultText"></div>
    
    <!-- Hiển thị ngày/tháng/năm chữ to phía dưới vòng quay -->
    <div id="dateDisplay"></div>

    <script>
        // 1. CẤU HÌNH KẾT NỐI DATABASE FIREBASE
        const firebaseConfig = { 
            databaseURL: "https://photoeve-xxxx-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. HIỂN THỊ NGÀY THÁNG NĂM THEO THỜI GIAN THỰC
        function updateDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            document.getElementById('dateDisplay').innerText = `${day}/${month}/${year}`;
        }
        updateDate();

        // 3. VẼ ĐỒ HỌA VÒNG QUAY BẰNG CANVAS
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const gifts = ["Giải Ba: Móc Khóa", "Giải Nhì: Set Sticker", "Giải Nhất: Túi Tote", "Giải Ba: Móc Khóa", "Giải Nhì: Set Sticker", "May Mắn Lần Sau"];
        const colors = ["#10b981", "#3b82f6", "#ef4444", "#10b981", "#3b82f6", "#475569"];
        const numSectors = gifts.length;
        const arc = 2 * Math.PI / numSectors;

        function drawWheel() {
            for (let i = 0; i < numSectors; i++) {
                let angle = i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(150, 150, 150, angle, angle + arc);
                ctx.lineTo(150, 150);
                ctx.fill();
                
                ctx.save();
                ctx.translate(150, 150);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "white";
                ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "right";
                ctx.fillText(gifts[i], 140, 5);
                ctx.restore();
            }
        }
        drawWheel();

        // 4. KỊCH BẢN QUAY 24 GIÂY: QUAY TÍT -> CHẬM DẦN -> LẮC LƯ 2 LẦN
        let isSpinning = false;
        let animationId = null;
        let currentAngle = 0;
        
        const spinBtn = document.getElementById('spinBtn');
        const subText = document.getElementById('subText');
        const resultText = document.getElementById('resultText');
        
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            
            subText.style.display = 'none';
            resultText.style.display = 'none';
            
            if (animationId) cancelAnimationFrame(animationId);
            
            const randomShift = Math.floor(Math.random() * 360); 
            const totalDuration = 24000; // Tổng thời gian 24 giây
            let startTime = null;

            function animateWheel(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed < totalDuration) {
                    let currentSpeed = 0;

                    // 10 GIÂY ĐẦU: Quay tít tốc độ cao ổn định ở mọi lượt quay
                    if (elapsed <= 10000) {
                        currentSpeed = 35; 
                    }
                    // 10 GIÂY TIẾP THEO: Giảm tốc độ mượt mà
                    else if (elapsed <= 20000) {
                        let t = (elapsed - 10000) / 10000;
                        currentSpeed = 35 * (1 - t); 
                    }
                    // 4 GIÂY CUỐI: Lắc lư ngược xuôi 2 lần trước khi dừng
                    else {
                        let t = (elapsed - 20000) / 4000;
                        let targetAngle = Math.ceil(currentAngle / 360) * 360 + randomShift;
                        let shake = Math.sin(t * Math.PI * 4) * (1 - t) * 25; 
                        currentAngle = targetAngle + shake;
                    }

                    if (elapsed <= 20000) {
                        currentAngle += currentSpeed;
                    }

                    canvas.style.transform = `rotate(${currentAngle % 360}deg)`;
                    animationId = requestAnimationFrame(animateWheel);
                } else {
                    // KHI DỪNG HẲN: Khóa vị trí và hiển thị kết quả
                    const finalAngle = (Math.ceil(currentAngle / 360) * 360 + randomShift) % 360;
                    canvas.style.transform = `rotate(${finalAngle}deg)`;
                    currentAngle = finalAngle;
                    
                    const index = Math.floor(((360 - finalAngle + 270) % 360) / (360 / numSectors));
                    const prize = gifts[index];

                    resultText.innerHTML = prize === "May Mắn Lần Sau" ? `🎉 Chúc bạn ${prize}!` : `🎁 Trúng giải: ${prize}!`;
                    resultText.style.display = 'block';
                    
                    isSpinning = false;
                }
            }

            // ĐỒNG BỘ CƠ SỞ DỮ LIỆU FIREBASE
            const now = new Date();
            const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            database.ref('total_spins/' + todayStr).transaction((currentValue) => {
                return (currentValue || 0) + 1;
            });

            animationId = requestAnimationFrame(animateWheel);
        });
    </script>
</body>
</html>
