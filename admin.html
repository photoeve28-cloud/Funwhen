<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO EVE - Trang Quản Trị (Admin)</title>
    
    <!-- Thư viện Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #bf953f;
        }
        h1 {
            text-align: center;
            color: #fcf6ba;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .stats-card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            border-left: 4px solid #38bdf8;
        }
        .stats-number {
            font-size: 32px;
            font-weight: bold;
            color: #38bdf8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #475569;
        }
        th {
            background-color: #334155;
            color: #fcf6ba;
        }
        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .prize-tag {
            background: #0284c7;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .empty-msg {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PHOTO EVE ADMIN</h1>
        <div class="subtitle">Thống Kê Lượt Quay & Giải Thưởng Ngày Hôm Nay</div>

        <!-- Thẻ thống kê tổng lượt quay -->
        <div class="stats-card">
            <div>Tổng Số Lượt Quay Trong Ngày</div>
            <div class="stats-number" id="totalSpins">0</div>
        </div>

        <!-- Bảng danh sách trúng thưởng -->
        <h3>📜 Lịch Sử Trúng Thưởng</h3>
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Thời Gian</th>
                    <th>Giải Thưởng Nhận Được</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <tr>
                    <td colspan="3" class="empty-msg">Đang tải dữ liệu từ Firebase...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Tạo khóa định danh theo ngày dạng: PHOTOEVE_YYYY-MM-DD
        function getTodayKey() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    return `PHOTOEVE_${year}-${month}-${day}`;
}

const firebaseConfig = { 
    databaseURL: "https://photoeve-a5e2c-default-rtdb.firebaseio.com/" 
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const todayKey = getTodayKey();
const spinRef = database.ref('daily_spins/' + todayKey);

// Lắng nghe dữ liệu thay đổi theo thời gian thực (Realtime)
spinRef.on('value', (snapshot) => {
    const data = snapshot.val();
    const tableBody = document.getElementById('historyTableBody');
    const totalDisplay = document.getElementById('totalSpins');

    if (!data) {
        totalDisplay.innerText = "0";
        tableBody.innerHTML = `<tr><td colspan="3" class="empty-msg">Chưa có lượt quay nào trong ngày hôm nay.</td></tr>`;
        return;
    }

    // Cập nhật số lượt quay
    totalDisplay.innerText = data.count || 0;

    // Cập nhật danh sách lịch sử trúng thưởng
    if (data.history) {
        const historyArray = Object.values(data.history).reverse();
        let html = '';
        
        historyArray.forEach((item, index) => {
            html += `
                <tr>
                    <td>#${historyArray.length - index}</td>
                    <td>${item.time}</td>
                    <td><span class="prize-tag">${item.prize}</span></td>
                </tr>
            `;
        });
        tableBody.innerHTML = html;
    } else {
        tableBody.innerHTML = `<tr><td colspan="3" class="empty-msg">Chưa có lịch sử quay thưởng.</td></tr>`;
    }
});
    </script>
</body>
</html>
