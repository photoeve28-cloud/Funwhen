<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO EVE ADMIN - Thống Kê</title>
    
    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 60%, #020617 100%);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .admin-container {
            width: 100%;
            max-width: 800px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #b38728 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 4px;
        }
        .stat-card {
            background: rgba(15, 23, 42, 0.8);
            border-left: 4px solid #38bdf8;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            background: rgba(15, 23, 42, 0.9);
            color: #fcf6ba;
            font-size: 14px;
        }
        td { font-size: 14px; }
        .prize-tag {
            color: #38bdf8;
            font-weight: 600;
        }
        .empty-msg {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header">
            <h1 class="brand-title">PHOTO EVE ADMIN</h1>
            <div class="subtitle">Thống Kê Lượt Quay & Giải Thưởng Ngày Hôm Nay</div>
        </div>

        <div class="stat-card">
            <div>Tổng Số Lượt Quay Trong Ngày</div>
            <div class="stat-number" id="totalSpins">0</div>
        </div>

        <h3>📜 Lịch Sử Trúng Thưởng</h3>
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Thời Gian</th>
                    <th>Giải Thưởng Nhận Được</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <tr>
                    <td colspan="3" class="empty-msg">Đang tải dữ liệu...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // 1. Chuẩn hóa Date Key khớp 100% với index.html
        function getTodayKey() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `PHOTOEVE_${year}-${month}-${day}`;
        }

        // 2. Khởi tạo Firebase Database
        const firebaseConfig = { databaseURL: "https://photoeve-a5e2c-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 3. Lắng nghe dữ liệu theo ngày
        const todayKey = getTodayKey();
        const spinRef = database.ref('daily_spins/' + todayKey);

        spinRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const tableBody = document.getElementById('historyTableBody');
            const totalDisplay = document.getElementById('totalSpins');

            if (!data) {
                totalDisplay.innerText = "0";
                tableBody.innerHTML = `<tr><td colspan="3" class="empty-msg">Chưa có lượt quay nào trong ngày hôm nay.</td></tr>`;
                return;
            }

            // Hiển thị tổng số lượt quay
            totalDisplay.innerText = data.count || 0;

            // Hiển thị bảng lịch sử (Lượt mới nhất xếp lên đầu)
            if (data.history) {
                const historyArray = Object.values(data.history).reverse();
                let html = '';
                
                historyArray.forEach((item, index) => {
                    html += `
                        <tr>
                            <td>#${historyArray.length - index}</td>
                            <td>${item.time}</td>
                            <td><span class="prize-tag">${item.prize}</span></td>
                        </tr>
                    `;
                });
                tableBody.innerHTML = html;
            } else {
                tableBody.innerHTML = `<tr><td colspan="3" class="empty-msg">Chưa có lịch sử quay thưởng.</td></tr>`;
            }
        });
    </script>
</body>
</html>
